name: Test Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allow manual triggering

jobs:
  setup-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Create test environment file
        run: |
          cp .env.example .env.test
          echo "DEV_MODE=true" >> .env.test
          echo "DB_PATH=test_db.sqlite" >> .env.test
          echo "MOCK_EMAIL_DIR=example_mails/" >> .env.test
          echo "LOG_LEVEL=WARNING" >> .env.test

      - name: Initialize test database
        env:
          CI: true
          DB_PATH: test_db.sqlite
        run: |
          python db_init.py
          python app_init.py

      - name: Download test emails (optional)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          INBOX: ${{ secrets.INBOX || 'INBOX' }}
        run: |
          if [ ! -z "$IMAP_HOST" ] && [ ! -z "$IMAP_USER" ] && [ ! -z "$IMAP_PASSWORD" ]; then
            echo "Downloading test emails..."
            python email_downloader.py --num-emails 5 --output-dir example_mails --ci --manifest
          else
            echo "No IMAP credentials provided, using existing mock emails"
          fi

      - name: Run unit tests
        env:
          CI: true
          DEV_MODE: true
          DB_PATH: test_db.sqlite
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Run integration tests
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          CI: true
          DEV_MODE: true
          DB_PATH: test_db.sqlite
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        run: |
          pytest tests/integration/ -v

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload test database for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-database
          path: test_db.sqlite