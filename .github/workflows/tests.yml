name: Run Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
        sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxrender1 libxext6
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Set up test environment
      run: |
        # Create test environment file with GitHub secrets (if available) or test values
        cat > .env << EOF
        DEV_MODE=true
        LOG_LEVEL_CONSOLE=30
        LOG_LEVEL_FILE=30
        LOG_PATH=./.filesystem/logs/
        FILESYSTEM_PATH=./.filesystem/
        CERTIFICATE_TEMPLATE_PATH=./.filesystem/certificate_template.docx
        CERTIFICATE_TOS_PATH=./.filesystem/terms_conditions.pdf
        OCR_USE_GPU=false
        IMAP_HOST=${IMAP_HOST:-test.mail.server.com}
        IMAP_PORT=${IMAP_PORT:-993}
        IMAP_USER=${IMAP_USER:-test_user}
        IMAP_PASSWORD=${IMAP_PASSWORD:-test_password}
        INBOX=${INBOX:-test_inbox}
        EXAMPLE_MAIL_PATH=./example_mails/
        EOF
        
        # Initialize the application using the existing script
        python app_init.py --skip-db-init
        
        # Initialize the database using the existing script
        python db_init.py
        
        echo "Application initialized successfully using existing scripts"
      env:
        IMAP_HOST: ${{ secrets.IMAP_HOST }}
        IMAP_PORT: ${{ secrets.IMAP_PORT }}
        IMAP_USER: ${{ secrets.IMAP_USER }}
        IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        INBOX: ${{ secrets.INBOX }}
    
    - name: Download example emails
      run: |
        if [ "$IMAP_HOST" != "test.mail.server.com" ] && [ "$IMAP_USER" != "test_user" ]; then
          echo "Real email credentials detected, downloading example emails..."
          python email_downloader.py --num-emails 10 --output-dir ./example_mails/
          echo "Downloaded example emails successfully"
        else
          echo "Using test/mock credentials, skipping email download"
        fi
      env:
        IMAP_HOST: ${{ secrets.IMAP_HOST }}
        IMAP_PORT: ${{ secrets.IMAP_PORT }}
        IMAP_USER: ${{ secrets.IMAP_USER }}
        IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        INBOX: ${{ secrets.INBOX }}
      continue-on-error: true
    
    - name: Run tests with pytest
      run: |
        export PYTHONPATH="${PYTHONPATH}:${PWD}/src"
        cd src && python -m pytest -v --cov=. --cov-report=xml --cov-report=html --cov-report=term --tb=short ../tests/
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./src/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: src/htmlcov/
        retention-days: 7
    
    - name: Display coverage summary
      run: |
        echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        cd src && python -c "
        import xml.etree.ElementTree as ET
        tree = ET.parse('coverage.xml')
        root = tree.getroot()
        coverage = float(root.attrib['line-rate']) * 100
        print(f'Total Coverage: {coverage:.2f}%')
        " >> $GITHUB_STEP_SUMMARY